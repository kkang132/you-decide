[project]
name = "you-decide"
version = "0.1.0"
description = "Type a customer complaint, let a decision model route it, and grade it yourself."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pinned to the 0.4 series: the caveats in ARCHITECTURE.md were checked on 0.4.4.
    "laya>=0.4.4,<0.5",
    "rich>=15.0.0",
]

[project.scripts]
you-decide = "you_decide.cli:main"

[dependency-groups]
# `rich` is repeated here so CI can install this group alone (`uv sync --only-group dev`)
# and run every check without downloading Laya, torch, or CUDA. See .github/workflows/ci.yml.
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "rich>=15.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/you_decide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_ignores = true
# Laya ships without type hints, and CI does not install it.
[[tool.mypy.overrides]]
module = ["laya", "laya.*"]
ignore_missing_imports = true
