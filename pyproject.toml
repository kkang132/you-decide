[project]
name = "you-decide"
version = "0.1.0"
description = "Type a customer complaint, let a decision model route it, and grade it yourself."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "laya>=0.3.21",
    "rich>=15.0.0",
]

[project.scripts]
you-decide = "you_decide.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/you_decide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
